name: Build Android Debug APK

on:
  workflow_dispatch:
    inputs:
      firebase_config:
        description: 'Firebase Config (base64 encoded .env.local content)'
        required: false
        default: ''
        type: string

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Firebase Config (if provided)
        if: inputs.firebase_config != ''
        run: |
          echo "${{ inputs.firebase_config }}" | base64 -d > .env.local
          echo "Firebase config configured"
        shell: bash

      - name: Validate Firebase Config
        run: |
          if [ ! -f .env.local ]; then
            echo "::warning::No .env.local file found. Build may fail if Firebase config is required."
            echo "VITE_FIREBASE_API_KEY=dummy" > .env.local
            echo "VITE_FIREBASE_AUTH_DOMAIN=dummy" >> .env.local
            echo "VITE_FIREBASE_PROJECT_ID=dummy" >> .env.local
            echo "VITE_FIREBASE_STORAGE_BUCKET=dummy" >> .env.local
            echo "VITE_FIREBASE_MESSAGING_SENDER_ID=dummy" >> .env.local
            echo "VITE_FIREBASE_APP_ID=dummy" >> .env.local
          fi
        shell: bash

      - name: Build web application
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Build Summary
        run: |
          echo "## Build Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact:** app-debug.apk" >> $GITHUB_STEP_SUMMARY
          echo "**Location:** android/app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_STEP_SUMMARY
          echo "**Retention:** 7 days" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### How to download:" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to the **Actions** tab" >> $GITHUB_STEP_SUMMARY
          echo "2. Click on this workflow run" >> $GITHUB_STEP_SUMMARY
          echo "3. Scroll down to **Artifacts**" >> $GITHUB_STEP_SUMMARY
          echo "4. Click on **app-debug** to download" >> $GITHUB_STEP_SUMMARY
